name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [8.3, 8.4]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2, cs2pr
          extensions: mbstring, pdo, pdo_mysql, bcmath, gd, xml, curl, zip
          coverage: xdebug

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-scripts --ignore-platform-reqs

      - name: Laravel Pint (code style)
        run: ./vendor/bin/pint --test --format=checkstyle | cs2pr --graceful-warnings

      - name: PHPStan (static analysis)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

      - name: Rector (dry-run)
        run: ./vendor/bin/rector process --dry-run --no-progress-bar 2>&1 || true

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [8.3, 8.4]
        db: [mysql:8.0, mariadb:10.11]

    services:
      mysql:
        image: ${{ matrix.db }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wedding_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: mbstring, pdo, pdo_mysql, bcmath, gd, xml, curl, zip, redis
          coverage: xdebug

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-scripts --ignore-platform-reqs

      - name: Environment setup
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
          php artisan storage:link

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wedding_db
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan migrate --force --no-interaction

      - name: Run tests with coverage
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wedding_db
          DB_USERNAME: root
          DB_PASSWORD: ""
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          php artisan key:generate --force --no-interaction
          php artisan test --coverage --min=60 2>&1 || true

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: php-${{ matrix.php-version }}
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-security-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-scripts --ignore-platform-reqs

      - name: Composer audit
        run: composer audit 2>&1 || true

      - name: Dependency version check
        run: composer outdated --direct --minor-only 2>&1 || true

  notify:
    needs: [lint, test, security]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Notify failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 CI Failure on main',
              body: `Workflow run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
